# Fly.io deployment for invoice.cerviz.co.uk
#
# One machine with one attached volume. That is deliberate: the database is
# SQLite on that volume, so a second machine would be a second database.
# Litestream streams a continuous copy off the machine, which is what makes a
# single instance safe rather than a single point of loss.

app = "cerviz-invoice"
primary_region = "lhr"          # London — the data stays in the UK

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "cerviz_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale beyond one machine: two instances would each hold their own
  # copy of the database and silently diverge.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 120

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
